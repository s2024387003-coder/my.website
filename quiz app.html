```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizMaster - JavaScript Quiz</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #141e30, #243b55);
            padding: 20px;
        }

        .quiz-container {
            width: 100%;
            max-width: 700px;
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #243b55;
            font-size: 34px;
            margin-bottom: 8px;
        }

        .header p {
            color: #777;
        }

        .progress-section {
            margin-bottom: 25px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
        }

        .progress-bar {
            width: 100%;
            height: 9px;
            background: #e5e5e5;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 0%;
            background: #243b55;
            transition: 0.3s;
        }

        .question {
            font-size: 23px;
            font-weight: bold;
            color: #222;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .options {
            display: grid;
            gap: 13px;
        }

        .option {
            width: 100%;
            padding: 15px 18px;
            border: 2px solid #ddd;
            border-radius: 12px;
            background: white;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option:hover {
            border-color: #243b55;
            background: #f4f7fa;
        }

        .option.correct {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        .option.wrong {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }

        .option:disabled {
            cursor: not-allowed;
        }

        .feedback {
            margin-top: 18px;
            padding: 14px;
            border-radius: 10px;
            display: none;
            font-weight: bold;
        }

        .feedback.correct-feedback {
            display: block;
            background: #d4edda;
            color: #155724;
        }

        .feedback.wrong-feedback {
            display: block;
            background: #f8d7da;
            color: #721c24;
        }

        .next-btn {
            width: 100%;
            margin-top: 22px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #243b55;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            transition: 0.2s;
        }

        .next-btn:hover {
            background: #141e30;
        }

        .result {
            display: none;
            text-align: center;
        }

        .result h2 {
            font-size: 35px;
            color: #243b55;
            margin-bottom: 15px;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #243b55;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 25px auto;
            font-size: 32px;
            font-weight: bold;
        }

        .result-message {
            font-size: 20px;
            color: #555;
            margin-bottom: 25px;
        }

        .restart-btn {
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            background: #243b55;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .restart-btn:hover {
            background: #141e30;
        }

        @media (max-width: 600px) {
            .quiz-container {
                padding: 25px 18px;
            }

            .header h1 {
                font-size: 28px;
            }

            .question {
                font-size: 19px;
            }

            .option {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="quiz-container">

        <div class="header">
            <h1>QuizMaster</h1>
            <p>Test Your Knowledge</p>
        </div>

        <div id="quiz-screen">

            <div class="progress-section">
                <div class="progress-info">
                    <span id="question-number">Question 1 of 10</span>
                    <span id="score-display">Score: 0</span>
                </div>

                <div class="progress-bar">
                    <div class="progress" id="progress"></div>
                </div>
            </div>

            <div class="question" id="question">
                Question goes here
            </div>

            <div class="options" id="options"></div>

            <div class="feedback" id="feedback"></div>

            <button class="next-btn" id="next-btn">
                Next Question →
            </button>

        </div>

        <div class="result" id="result">

            <h2>Quiz Completed!</h2>

            <div class="score-circle">
                <span id="final-score">0/10</span>
            </div>

            <p class="result-message" id="result-message">
                Great job!
            </p>

            <button class="restart-btn" onclick="restartQuiz()">
                Restart Quiz
            </button>

        </div>

    </div>

    <script>

        // =========================
        // QUIZ QUESTIONS
        // =========================

        const questions = [

            {
                question: "Which language is mainly used to make web pages interactive?",
                options: [
                    "HTML",
                    "CSS",
                    "JavaScript",
                    "SQL"
                ],
                answer: 2
            },

            {
                question: "Which keyword is used to declare a variable in JavaScript?",
                options: [
                    "var",
                    "variable",
                    "int",
                    "string"
                ],
                answer: 0
            },

            {
                question: "Which symbol is used for a single-line comment in JavaScript?",
                options: [
                    "/* */",
                    "//",
                    "<!-- -->",
                    "#"
                ],
                answer: 1
            },

            {
                question: "Which method is used to print something to the browser console?",
                options: [
                    "print()",
                    "console.log()",
                    "write.console()",
                    "log.console()"
                ],
                answer: 1
            },

            {
                question: "Which of the following is a JavaScript data type?",
                options: [
                    "String",
                    "HTML",
                    "CSS",
                    "Browser"
                ],
                answer: 0
            },

            {
                question: "Which operator is used for strict equality in JavaScript?",
                options: [
                    "==",
                    "=",
                    "===",
                    "!="
                ],
                answer: 2
            },

            {
                question: "Which method adds an element to the end of an array?",
                options: [
                    "push()",
                    "pop()",
                    "shift()",
                    "remove()"
                ],
                answer: 0
            },

            {
                question: "Which keyword is used to create a function?",
                options: [
                    "function",
                    "func",
                    "method",
                    "create"
                ],
                answer: 0
            },

            {
                question: "What does DOM stand for?",
                options: [
                    "Document Object Model",
                    "Data Object Method",
                    "Document Oriented Model",
                    "Digital Object Management"
                ],
                answer: 0
            },

            {
                question: "Which method converts a JSON string into a JavaScript object?",
                options: [
                    "JSON.parse()",
                    "JSON.stringify()",
                    "JSON.convert()",
                    "JSON.object()"
                ],
                answer: 0
            }

        ];


        // =========================
        // VARIABLES
        // =========================

        let currentQuestion = 0;
        let score = 0;
        let answered = false;


        // =========================
        // HTML ELEMENTS
        // =========================

        const questionElement = document.getElementById("question");
        const optionsElement = document.getElementById("options");
        const nextButton = document.getElementById("next-btn");
        const feedbackElement = document.getElementById("feedback");
        const questionNumber = document.getElementById("question-number");
        const scoreDisplay = document.getElementById("score-display");
        const progress = document.getElementById("progress");
        const quizScreen = document.getElementById("quiz-screen");
        const resultScreen = document.getElementById("result");
        const finalScore = document.getElementById("final-score");
        const resultMessage = document.getElementById("result-message");


        // =========================
        // LOAD QUESTION
        // =========================

        function loadQuestion() {

            answered = false;

            const current = questions[currentQuestion];

            questionElement.textContent = current.question;

            questionNumber.textContent =
                `Question ${currentQuestion + 1} of ${questions.length}`;

            scoreDisplay.textContent = `Score: ${score}`;

            progress.style.width =
                `${((currentQuestion + 1) / questions.length) * 100}%`;

            optionsElement.innerHTML = "";

            feedbackElement.style.display = "none";
            feedbackElement.className = "feedback";

            nextButton.style.display = "none";

            current.options.forEach((option, index) => {

                const button = document.createElement("button");

                button.classList.add("option");

                button.textContent = option;

                button.addEventListener("click", () => {
                    selectAnswer(index, button);
                });

                optionsElement.appendChild(button);

            });
        }


        // =========================
        // SELECT ANSWER
        // =========================

        function selectAnswer(selectedIndex, selectedButton) {

            if (answered) return;

            answered = true;

            const correctAnswer =
                questions[currentQuestion].answer;

            const allOptions =
                document.querySelectorAll(".option");

            allOptions.forEach(button => {
                button.disabled = true;
            });


            if (selectedIndex === correctAnswer) {

                score++;

                selectedButton.classList.add("correct");

                feedbackElement.textContent =
                    "✓ Correct! Well done.";

                feedbackElement.classList.add(
                    "correct-feedback"
                );

            } else {

                selectedButton.classList.add("wrong");

                allOptions[correctAnswer]
                    .classList.add("correct");

                feedbackElement.textContent =
                    "✗ Incorrect! The correct answer is: " +
                    questions[currentQuestion].options[correctAnswer];

                feedbackElement.classList.add(
                    "wrong-feedback"
                );
            }

            scoreDisplay.textContent = `Score: ${score}`;

            nextButton.style.display = "block";

        }


        // =========================
        // NEXT QUESTION
        // =========================

        nextButton.addEventListener("click", () => {

            currentQuestion++;

            if (currentQuestion < questions.length) {

                loadQuestion();

            } else {

                showResult();

            }

        });


        // =========================
        // SHOW RESULT
        // =========================

        function showResult() {

            quizScreen.style.display = "none";

            resultScreen.style.display = "block";

            finalScore.textContent =
                `${score}/${questions.length}`;

            const percentage =
                (score / questions.length) * 100;


            if (percentage === 100) {

                resultMessage.textContent =
                    "🏆 Perfect score! Excellent work!";

            } else if (percentage >= 80) {

                resultMessage.textContent =
                    "🎉 Great job! You have strong knowledge.";

            } else if (percentage >= 60) {

                resultMessage.textContent =
                    "👍 Good effort! Keep practicing.";

            } else if (percentage >= 40) {

                resultMessage.textContent =
                    "📚 Not bad! A little more practice will help.";

            } else {

                resultMessage.textContent =
                    "💪 Keep learning and try again!";

            }

        }


        // =========================
        // RESTART QUIZ
        // =========================

        function restartQuiz() {

            currentQuestion = 0;

            score = 0;

            quizScreen.style.display = "block";

            resultScreen.style.display = "none";

            loadQuestion();

        }


        // =========================
        // START QUIZ
        // =========================

        loadQuestion();

    </script>

</body>
</html>
```
